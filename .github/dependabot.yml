version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Runtime requirements have their own entry; avoid duplicate pip PRs.
    exclude-paths:
      - "werewolf_web/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /werewolf_web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
